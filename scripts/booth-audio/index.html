<!doctype html><html><head><meta charset="utf-8"><title>Booth audio</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#11151a;color:#e7edf4;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#06080a;border:1px solid #303c49}nav{display:flex;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}button{background:#28465c;color:white;border:1px solid #557189;border-radius:6px;padding:10px 18px;font:inherit}button:disabled{opacity:.45}input{accent-color:#65bad3}small{color:#a3b2c1}#status{padding:12px;background:#1a232e;border-radius:6px}h1{font-size:22px;margin:0 0 16px}</style></head><body><main><h1>Booth</h1><img id="booth" alt="Live Booth game video"><nav><button id="play">Play audio</button><button id="stop" disabled>Stop audio</button><label><input id="mute" type="checkbox"> Mute</label><label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6"></label><span id="volume-label">60%</span></nav><div id="status" role="status">Audio is stopped. Play starts audio for this viewer.</div><p><small>Video and audio use separate local connections. Audio stops after two minutes; Play starts a fresh capture.</small></p></main><script>
const config=__CONFIG__;document.querySelector('#booth').src=config.booth;
const status=document.querySelector('#status'),play=document.querySelector('#play'),stopButton=document.querySelector('#stop'),mute=document.querySelector('#mute'),volume=document.querySelector('#volume'),volumeLabel=document.querySelector('#volume-label');
let controller=null,context=null,gain=null,reader=null;const sources=new Set();let nextTime=0,playing=false;const auth={'x-viewer-token':config.token};
function volumeChanged(){volumeLabel.textContent=Math.round(Number(volume.value)*100)+'%';if(gain)gain.gain.setValueAtTime(mute.checked?0:Number(volume.value),context.currentTime);}
volume.addEventListener('input',volumeChanged);mute.addEventListener('change',volumeChanged);
async function dispose(){for(const source of sources){try{source.stop();}catch{}}sources.clear();if(reader){try{await reader.cancel();}catch{}reader=null;}if(context){try{await context.close();}catch{}context=null;}gain=null;}
async function stop(){if(!playing)return;controller?.abort();await fetch('/stop',{method:'POST',headers:auth}).catch(()=>{});await dispose();status.textContent='Audio stopped.';}
stopButton.addEventListener('click',()=>void stop());window.addEventListener('pagehide',()=>{controller?.abort();for(const source of sources){try{source.stop();}catch{}}});
function concatenate(a,b){if(a.length+b.length>131096)throw Error('Audio receive queue exceeded');const c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c;}
async function schedule(bytes,signal){const frames=bytes.length/4;const data=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);for(let offset=0;offset<frames;offset+=4410){while(nextTime-context.currentTime>0.2){if(signal.aborted)throw new DOMException('Stopped','AbortError');await new Promise(r=>setTimeout(r,10));}if(signal.aborted)throw new DOMException('Stopped','AbortError');const count=Math.min(4410,frames-offset);const buffer=context.createBuffer(2,count,44100);for(let channel=0;channel<2;channel++){const samples=buffer.getChannelData(channel);for(let i=0;i<count;i++)samples[i]=data.getInt16((offset+i)*4+channel*2,true)/32768;}const source=context.createBufferSource();source.buffer=buffer;source.connect(gain);source.onended=()=>sources.delete(source);sources.add(source);nextTime=Math.max(nextTime,context.currentTime+0.02);source.start(nextTime);nextTime+=count/44100;}}
play.addEventListener('click',async()=>{if(playing)return;playing=true;play.disabled=true;stopButton.disabled=false;controller=new AbortController();let pending=new Uint8Array(0),header=false,clean=false,records=0,total=0;
try{context=new AudioContext({latencyHint:'interactive'});gain=context.createGain();gain.connect(context.destination);volumeChanged();await context.resume();nextTime=context.currentTime+0.02;status.textContent='Connecting audio…';const response=await fetch('/audio',{method:'POST',headers:auth,signal:controller.signal});if(!response.ok)throw Error('Audio capture refused ('+response.status+')');reader=response.body.getReader({mode:'byob'});
 while(true){const {value,done}=await reader.read(new Uint8Array(65536));if(done)break;if(value.length>65536)throw Error('Audio chunk exceeded bound');pending=concatenate(pending,value);if(!header&&pending.length>=24){const view=new DataView(pending.buffer,pending.byteOffset,24);const expected=[0x4d43504e,1,44100,2,16,4];for(let i=0;i<6;i++)if(view.getUint32(i*4,true)!==expected[i])throw Error('Audio format mismatch');header=true;pending=pending.slice(24);status.textContent=mute.checked?'Audio connected, muted.':'Audio playing.';}
  while(header&&pending.length>=4){const length=new DataView(pending.buffer,pending.byteOffset,4).getUint32(0,true);if(length===0){if(pending.length!==4)throw Error('Data after audio end');pending=new Uint8Array(0);clean=true;break;}if(length>65536||length%4)throw Error('Invalid audio frame');if(pending.length<length+4)break;total+=length;if(total>120*176400+65536)throw Error('Audio lifetime exceeded');const bytes=pending.slice(4,4+length);pending=pending.slice(4+length);await schedule(bytes,controller.signal);records++;}if(clean)break;}
 if(!clean||pending.length){status.textContent='Audio interrupted. An incomplete final packet was discarded.';}else{while(context&&context.currentTime<nextTime&&!controller.signal.aborted)await new Promise(r=>setTimeout(r,10));status.textContent='Audio capture ended. Play starts a fresh capture.';}
}catch(error){status.textContent=error.name==='AbortError'?(pending.length?'Audio stopped; incomplete packet discarded.':'Audio stopped.'):'Audio interrupted: '+error.message;}finally{controller?.abort();await dispose();playing=false;play.disabled=false;stopButton.disabled=true;window.audioProof={records,total,clean,partial:pending.length,playing:false};}
});
</script></body></html>
