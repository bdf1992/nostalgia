name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and catalog references
        shell: python
        run: |
          import json
          from pathlib import Path

          games = json.loads(Path('catalog/games.json').read_text(encoding='utf-8'))
          runtimes = json.loads(Path('catalog/runtimes.json').read_text(encoding='utf-8'))
          ps1 = json.loads(Path('catalog/ps1-stress.json').read_text(encoding='utf-8'))
          json.loads(Path('recipes/game.example.json').read_text(encoding='utf-8'))

          game_rows = games['games']
          assert len(game_rows) == 20, f"expected 20 starter games, got {len(game_rows)}"

          game_ids = [g['id'] for g in game_rows]
          assert len(game_ids) == len(set(game_ids)), 'duplicate game ids'

          runtime_ids = {r['id'] for r in runtimes['runtimes']}
          transport_ids = {t['id'] for t in runtimes['transports']}
          known_strategy_ids = transport_ids | {
              capability
              for runtime in runtimes['runtimes']
              for capability in runtime.get('multiplayer_capabilities', [])
          }

          for game in game_rows:
              assert game['preferred_runtime'] in runtime_ids, (
                  f"{game['id']} references unknown runtime {game['preferred_runtime']}"
              )
              assert game['multiplayer_strategy'] in known_strategy_ids, (
                  f"{game['id']} references unknown strategy {game['multiplayer_strategy']}"
              )

          ps1_rows = ps1['cases']
          assert len(ps1_rows) == 20, f"expected 20 PS1 stress fixtures, got {len(ps1_rows)}"
          ps1_ids = [g['id'] for g in ps1_rows]
          assert len(ps1_ids) == len(set(ps1_ids)), 'duplicate PS1 stress ids'
          assert ps1['preferred_runtime'] in runtime_ids, 'PS1 stress pack references unknown runtime'
          assert ps1['preferred_transport'] in transport_ids, 'PS1 stress pack references unknown transport'

          required_stress_levels = {'L0', 'L1', 'L2', 'L3', 'L4', 'L5', 'L6'}
          assert set(ps1['stress_levels']) == required_stress_levels, 'PS1 stress levels must be L0-L6'

          for case in ps1_rows:
              assert case['expected_max_players'] >= 2, f"{case['id']} is not a multiplayer stress fixture"
              assert case['validation'] in {'stub', 'candidate', 'validated', 'known-good', 'broken'}
              assert case['stress'], f"{case['id']} has no stress dimensions"
              assert case['input_topology'], f"{case['id']} has no input topology"

          max_players = max(g['expected_max_players'] for g in ps1_rows)
          assert max_players >= 8, 'PS1 pack must contain an eight-player saturation fixture'
          assert any(g['expected_max_players'] == 5 for g in ps1_rows), 'PS1 pack must contain an odd five-player fixture'
          assert any('shared-controller' in g['stress'] for g in ps1_rows), 'PS1 pack must test shared-controller semantics'
          assert any('save-heavy' in g['stress'] for g in ps1_rows), 'PS1 pack must test save-heavy persistence'

          print(
              f"validated {len(game_rows)} starter games, {len(ps1_rows)} PS1 stress fixtures, "
              f"{len(runtime_ids)} runtimes, {len(transport_ids)} transports"
          )

      - name: Reject accidentally tracked game/firmware/save artifacts
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          blocked = {
              '.iso', '.xiso', '.chd', '.cso', '.gcz', '.rvz', '.wbfs',
              '.gdi', '.cdi', '.cue', '.rom', '.nes', '.sfc', '.smc',
              '.n64', '.z64', '.v64', '.gb', '.gbc', '.gba', '.nds',
              '.3ds', '.bin', '.sav', '.srm', '.mcd', '.ps2', '.raw'
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [p for p in tracked if Path(p).suffix.lower() in blocked]
          assert not bad, 'restricted/local binary artifacts are tracked: ' + ', '.join(bad)

  powershell-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Nostalgia doctor
        shell: pwsh
        run: ./nostalgia.ps1 doctor
      - name: Read starter catalogs through helper
        shell: pwsh
        run: |
          ./nostalgia.ps1 games
          ./nostalgia.ps1 runtimes
          ./nostalgia.ps1 ps1
          ./nostalgia.ps1 ps1-plan twisted-metal-2-ps1
          ./nostalgia.ps1 ps1-plan crash-bash-ps1
          ./nostalgia.ps1 ps1-plan micro-maniacs-ps1
